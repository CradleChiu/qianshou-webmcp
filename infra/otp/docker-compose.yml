name: journey-otp

services:
  otp:
    image: opentripplanner/opentripplanner:2.9.0
    command: ["--load", "--serve"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2g -XX:+UseStringDeduplication"
    mem_limit: 3g
    mem_reservation: 1g
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./data
        target: /var/opentripplanner
      - type: bind
        source: ./build-config.json
        target: /var/opentripplanner/build-config.json
        read_only: true
      - type: bind
        source: ./router-config.json
        target: /var/opentripplanner/router-config.json
        read_only: true
      - type: bind
        source: ./otp-config.json
        target: /var/opentripplanner/otp-config.json
        read_only: true
    restart: unless-stopped
